{% extends "base.html" %}
{% block title %}Upload Output — {{ cmd.description[:40] }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Upload Command Output</h1>
        <div class="text-dim text-sm mt-1">{{ cmd.description }} &middot; Port {{ cmd.port }}</div>
    </div>
    <a href="{{ url_for('scan_commands', scan_id=scan.id) }}" class="btn btn-secondary btn-sm">Back to Commands</a>
</div>

<div class="card" style="max-width:800px; margin-bottom:1rem;">
    <div class="card-header">Command to run</div>
    <code style="display:block; padding:0.75rem; background:#0a0c10; border-radius:var(--radius-sm); color:var(--green); font-family:'SF Mono',Consolas,monospace; font-size:0.85rem; margin-top:0.5rem; word-break:break-all; white-space:pre-wrap;">{{ cmd.command }}</code>
</div>

<div class="card" style="max-width:800px;">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Paste Output</label>
            <textarea name="output_content" class="form-control mono" rows="14"
                style="font-size:0.8rem; min-height:200px;"
                placeholder="Paste the command output here..."></textarea>
        </div>

        <div class="form-group">
            <label>Or Upload File</label>
            <input type="file" name="output_file" class="form-control" accept=".txt,.log,.xml,.json,.html">
        </div>

        <div class="btn-group" style="margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary">Analyze Output</button>
            <a href="{{ url_for('scan_commands', scan_id=scan.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
